<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحضير Open Doors – اللغة الروسية والثقافة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1729;--card:#18233d;--card2:#1f2c4b;--line:#2c3c62;--tx:#eef2fb;--mut:#9fb0d3;--acc:#4f8cff;--acc2:#ffcf4a;--ok:#2fc98a;--bad:#ff5f6d;--ru:#ff8a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Inter,system-ui,sans-serif;font-size:16px;line-height:1.55}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,41,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;flex:1;font-weight:800}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.tbtn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tbtn.on{background:var(--acc);border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer;text-align:right;color:var(--tx);font-family:inherit}
.tile .ic{font-size:26px}
.tile b{display:block;font-size:15px;margin-top:4px}
.tile small{color:var(--mut);font-size:12px}
.tile:active{transform:scale(.98)}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 6px;color:var(--acc2)}
.mut{color:var(--mut);font-size:13px}
.en{direction:ltr;text-align:left;font-family:Inter,system-ui,sans-serif}
.ar{direction:rtl;text-align:right;color:#cfe0ff;background:#13203a;border-right:3px solid var(--acc);padding:6px 10px;border-radius:8px;margin-top:6px;font-size:15px;display:none}
body.tr .ar,.ar.show{display:block}
.w{cursor:pointer;border-radius:4px;transition:background .15s}
.w:hover{background:rgba(79,140,255,.18)}
.w.say{background:var(--acc2);color:#111}
.ruw{color:var(--ru);font-weight:700}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;color:var(--tx);font-family:inherit;text-align:left}
.opt.sel{border-color:var(--acc);background:#1d3466}
.opt.good{border-color:var(--ok);background:#123d33}
.opt.badx{border-color:var(--bad);background:#43202a}
.opt .ar{margin-top:4px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#273a66;color:#bcd0ff;margin-left:4px}
.tag.m{background:#5a3b10;color:#ffd99a}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.fb.good{background:#123d33;border:1px solid var(--ok)}
.fb.bad{background:#43202a;border:1px solid var(--bad)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok))}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,41,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav.bot button{background:none;border:0;color:var(--mut);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:4px 6px}
nav.bot button span{font-size:20px}
nav.bot button.on{color:var(--acc2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc)}
.fact{border-bottom:1px dashed var(--line);padding:9px 0}
.fact:last-child{border-bottom:0}
.flip{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.big{font-size:34px;font-weight:800;color:var(--ru)}
.mcol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:9px;font-size:14px;cursor:pointer;color:var(--tx);font-family:inherit;text-align:left;direction:ltr}
.mi.sel{border-color:var(--acc2)}
.mi.done{border-color:var(--ok);opacity:.55}
.mi.wrong{border-color:var(--bad)}
textarea{width:100%;min-height:150px;background:#0c1426;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:Inter,sans-serif;font-size:15px;direction:ltr}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}
.frag{background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:9px;margin:6px 0;cursor:pointer;direction:ltr;text-align:left;font-size:14px}
.frag.used{opacity:.35}
.frag b.n{color:var(--acc2);margin-right:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#000c;padding:8px 14px;border-radius:10px;font-size:14px;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.score{font-size:40px;font-weight:800;text-align:center;color:var(--acc2)}
.hint{background:#2a2410;border:1px solid #6b5a1e;border-radius:12px;padding:10px;font-size:14px;margin-bottom:10px}
</style>
</head>

<script>
/* ================= DATA ================= */
const FIELDS={
1:{n:"Russian Language",a:"اللغة الروسية (النظام، الوظائف، القواميس)",i:"🔤"},
2:{n:"Linguistics & Styles",a:"علم اللغة والأساليب",i:"🧠"},
3:{n:"Communication & Media",a:"التواصل والإعلام",i:"📡"},
4:{n:"Literary Theory",a:"نظرية الأدب",i:"✒️"},
5:{n:"Russian Literature",a:"الأدب الروسي",i:"📖"},
6:{n:"Russian Culture",a:"الثقافة الروسية",i:"🎭"}
};

/* Study notes: [en, ar] */
const NOTES={
1:[
["Russian is an East Slavic language of the Indo-European family. It uses the Cyrillic alphabet (кириллица) with 33 letters: 10 vowels, 21 consonants and 2 signs (ъ hard sign, ь soft sign).","الروسية لغة سلافية شرقية من العائلة الهندوأوروبية، تُكتب بالأبجدية الكيريلية وفيها 33 حرفاً: 10 حروف علّة، و21 حرفاً ساكناً، وعلامتان (ъ علامة القسوة وь علامة اللين)."],
["Russian is one of the six official languages of the UN and the most widely spoken Slavic language. It is the state language (государственный язык) of the Russian Federation, where more than 190 peoples live and many languages are spoken (Tatar, Bashkir, Chechen, Chuvash…).","الروسية وحدة من 6 لغات رسمية بالأمم المتحدة، وأكثر لغة سلافية انتشاراً. هي لغة الدولة بروسيا، وبروسيا عايشين أكتر من 190 شعب بلغات كتير (تترية، بشكيرية، شيشانية، تشوفاشية...)."],
["Parts of speech (части речи): independent – noun, adjective, numeral, pronoun, verb, adverb; auxiliary – preposition, conjunction, particle; plus interjection. Russian has NO articles (no a / the).","أقسام الكلام: المستقلة – الاسم، الصفة، العدد، الضمير، الفعل، الظرف. المساعدة – حرف الجر، حرف العطف، الأداة (частица). وفي كمان أداة التعجب. الروسية ما فيها أدوات تعريف ولا تنكير (ما في a ولا the)."],
["Noun (существительное): 3 genders – masculine, feminine, neuter (мужской, женский, средний); 2 numbers – singular and plural; 6 cases (падежи).","الاسم: إله 3 أجناس (مذكر، مؤنث، محايد)، وعددين (مفرد وجمع)، و6 حالات إعرابية."],
["The 6 cases: Nominative (кто? что?), Genitive (кого? чего?), Dative (кому? чему?), Accusative (кого? что?), Instrumental (кем? чем?), Prepositional (о ком? о чём?).","الحالات الست: الرفع/الفاعل (مين؟ شو؟)، الإضافة/الملكية (لمين؟ من شو؟)، المفعول غير المباشر (لمين؟)، المفعول به (مين؟ شو؟)، الأداة (بمين؟ بشو؟)، حالة حرف الجر (عن مين؟ عن شو؟)."],
["Verb (глагол): ASPECT (вид) shows how an action unfolds or is completed in time: imperfective (делать – to be doing) vs perfective (сделать – to get done). Verbs have 3 tenses: present, past, future. There is no Past Perfect.","الفعل: الصيغة (вид) بتبيّن كيف الحدث بصير أو بيكتمل مع الزمن: غير تام (делать = عم يعمل) وتام (сделать = عمل وخلّص). الأفعال إلها 3 أزمنة بس: حاضر، ماضي، مستقبل. ما في Past Perfect."],
["Other verb categories: mood (наклонение) – indicative, imperative, conditional; voice (залог) – active/passive; transitivity (переходность); person; number; conjugation I and II.","تصنيفات تانية للفعل: الصيغة الشرطية/الأمرية/الإخبارية (наклонение)، المبني للمعلوم والمجهول (залог)، التعدي واللزوم، الشخص، العدد، والتصريف الأول والتاني."],
["Functions of language: COMMUNICATIVE – passing information; APPELLATIVE (conative) – addressing someone, urging action (\"rise, my beauty!\"); PHATIC – making contact (\"Hello! How are you?\"); METALINGUISTIC – talking about language itself (dictionary definitions); POETIC (aesthetic) – focus on beauty of form; EMOTIVE – expressing feelings.","وظائف اللغة: التواصلية – نقل المعلومة. الندائية (appellative) – مخاطبة شخص وحثه على فعل (\"قومي يا حلوة!\"). التواصل الاجتماعي (phatic) – فتح تواصل (\"مرحبا، كيفك؟\"). الماوراء لغوية (metalinguistic) – الحديث عن اللغة نفسها (تعريفات القاموس). الشعرية/الجمالية – التركيز على جمال الشكل. التعبيرية – التعبير عن المشاعر."],
["EXAM TIP: a poem that calls to someone (\"My dear friend… rise!\" – Pushkin) → appellative. A poem that just paints beauty (Yesenin's gold stars) → poetic.","نصيحة للامتحان: قصيدة بتنادي حدا (\"صديقتي العزيزة... قومي!\" – بوشكين) ← ندائية. قصيدة بترسم جمال بس (نجوم يسينين الذهبية) ← شعرية."],
["Explanatory dictionaries (толковые словари) explain the meaning of words: Vladimir Dahl's dictionary, Ozhegov, Ushakov, BAS (Large Academic Dictionary), MAS (Small Academic Dictionary).","القواميس التفسيرية بتشرح معنى الكلمات: قاموس فلاديمير دال، أوجيغوف، أوشاكوف، القاموس الأكاديمي الكبير BAS، والصغير MAS."],
["Other dictionaries: Orthoepic (орфоэпический) – pronunciation and stress; Orthographic – spelling; Phraseological – idioms; Dictionary of Difficulties (словарь трудностей) – hard cases of grammar & pronunciation (NOT explanatory); Etymological (Vasmer) – word origins; dictionaries of synonyms/antonyms.","قواميس تانية: قاموس اللفظ (орфоэпический) – النطق والنبرة. قاموس الإملاء. قاموس التعابير الاصطلاحية. قاموس الصعوبات – الحالات الصعبة بالقواعد واللفظ (مش تفسيري!). القاموس التأصيلي (فاسمر) – أصل الكلمات. وقواميس المترادفات والأضداد."],
["Phonetics: stress (ударение) is free and mobile; unstressed O sounds like A (akanye): молоко → [malakó].","الصوتيات: النبرة بالروسي حرة ومتحركة. حرف O بدون نبرة بنلفظ متل A: молоко بتنقال [malakó]."]
],
2:[
["Language (язык) is a system of signs; speech (речь) is the use of that system in real communication (Ferdinand de Saussure).","اللغة نظام من الإشارات، والكلام هو استعمال هاد النظام بالتواصل الحقيقي (فرديناند دي سوسير)."],
["Levels of language (уровни языка): phonetic (sounds/phonemes) → morphemic (morphemes) → lexical (words) → morphological (word forms) → syntactic (sentences). Textology is NOT a language level.","مستويات اللغة: الصوتي (الأصوات) ← الصرفي/المورفيمات ← المعجمي (الكلمات) ← المورفولوجي (أشكال الكلمات) ← النحوي (الجمل). علم النصوص (textology) مش مستوى من مستويات اللغة."],
["Branches: PHONETICS – sound side of language; MORPHOLOGY – word forms and parts of speech; LEXICOLOGY – vocabulary; SYNTAX – sentences and phrases; SEMANTICS – meaning; ORTHOEPY – pronunciation norms; STYLISTICS – styles.","الفروع: الصوتيات – الجانب الصوتي. المورفولوجيا – أشكال الكلمات وأقسام الكلام. علم المفردات. النحو – الجمل والتراكيب. علم الدلالة – المعنى. علم اللفظ الصحيح. علم الأسلوب."],
["5 functional styles: SCIENTIFIC, OFFICIAL-BUSINESS, JOURNALISTIC (publicistic), COLLOQUIAL (conversational), LITERARY-ARTISTIC.","الأساليب الوظيفية الخمسة: العلمي، الرسمي/الإداري، الصحفي، العامي/المحادثة، الأدبي/الفني."],
["Scientific style: terms, unambiguous wording, logic, arguments, NO emotional words. Simple words, abbreviations and incomplete sentences belong to COLLOQUIAL style.","الأسلوب العلمي: مصطلحات، صياغة واضحة بمعنى واحد، منطق وحجج، وما فيه كلمات عاطفية. الكلمات البسيطة والاختصارات والجمل الناقصة هي من الأسلوب العامي."],
["Official-business style: fixed formulas and clichés, precision, no emotion (laws, contracts, applications). Journalistic style: informs AND persuades, uses evaluation. Artistic style: images, tropes, emotions.","الأسلوب الرسمي: عبارات ثابتة وقوالب جاهزة، دقة، بدون عاطفة (قوانين، عقود، طلبات). الصحفي: بيخبّر وبيقنع، وفيه تقييم. الفني: صور، مجازات، ومشاعر."],
["Forms of existence of a language: LITERARY language (the standard norm); territorial DIALECTS – different pronunciation & words in various regions; SOCIOLECTS – speech of social groups; COLLOQUIAL speech; VERNACULAR (просторечие) – non-standard speech.","أشكال وجود اللغة: اللغة الأدبية (المعيار الرسمي). اللهجات المناطقية – لفظ وكلمات مختلفة حسب المنطقة. اللهجات الاجتماعية (sociolects) – كلام فئات اجتماعية. الكلام العامي. والكلام الشعبي غير المعياري (просторечие)."],
["Sociolects: JARGON (жаргон) – speech of a group; ARGOT (арго) – secret language of closed groups; SLANG (сленг) – youth speech; professional speech (профессионализмы). A dialect is territorial, NOT social.","اللهجات الاجتماعية: الجارغون – كلام جماعة معينة. الأرغو – لغة سرية لجماعات مغلقة. السلانغ – كلام الشباب. ولغة المهن. أما اللهجة (dialect) فهي جغرافية مش اجتماعية."],
["Language norms (нормы): orthoepic (pronunciation), lexical (word choice), grammatical, spelling, punctuation, stylistic.","معايير اللغة: معيار اللفظ، معيار اختيار الكلمات، القواعد، الإملاء، الترقيم، والأسلوب."]
],
3:[
["Mass media (СМИ) functions: informational, educational, entertaining, persuasive/regulatory, integrating society.","وظائف وسائل الإعلام: الإخبار، التثقيف، الترفيه، الإقناع والتوجيه، وتوحيد المجتمع."],
["Types of media: press (newspapers, magazines), radio, television, Internet. New media features: ACCESSIBILITY (anytime, anywhere), interactivity, multimediality, hypertext, speed.","أنواع الإعلام: الصحافة المطبوعة، الراديو، التلفزيون، الإنترنت. ميزات الإعلام الجديد: سهولة الوصول (بأي وقت وأي مكان)، التفاعل، تعدد الوسائط، الروابط، والسرعة."],
["Media genres: informational – news item (заметка), report (репортаж), interview; analytical – article, commentary, review; artistic-journalistic – essay/sketch (очерк), feuilleton (satire).","أنواع المواد الإعلامية: إخبارية – خبر قصير، ريبورتاج، مقابلة. تحليلية – مقال، تعليق، مراجعة. فنية صحفية – مقالة وصفية (очерк)، ومقالة ساخرة (فيلتون)."],
["Russian media: Channel One (Первый канал) – leading news source; Russia-1; NTV; news agencies TASS and RIA Novosti; newspapers Rossiyskaya Gazeta, Kommersant, Izvestia. Entertainment: STS, TNT, Pyatnitsa!; sport: Match TV.","الإعلام الروسي: القناة الأولى – المصدر الرئيسي للأخبار. روسيا-1، NTV، وكالات الأنباء تاس وريا نوفوستي. صحف: روسيسكايا غازيتا، كوميرسانت، إزفستيا. ترفيه: STS، TNT، بياتنيتسا. رياضة: ماتش تي في."],
["Runet (Russian Internet) platforms: VKontakte (VK), Odnoklassniki, Telegram, Yandex, Dzen, Rutube. Trends of online language: rapid updating, variability, predominance of colloquial style, abbreviations, emojis.","منصات الإنترنت الروسي (رونت): فكونتاكتي، أودنوكلاسنيكي، تيليغرام، ياندكس، دزن، روتيوب. خصائص لغة الإنترنت: تتجدد بسرعة، متغيرة، يغلب عليها الأسلوب العامي، اختصارات وإيموجي."],
["Means of communication: VERBAL – words; NON-VERBAL – gestures, facial expressions, emojis, pictures; PARAVERBAL – intonation, tempo, volume, and online: CAPS, \"!!!\". Internet communication can use ALL three.","وسائل التواصل: لفظية – الكلمات. غير لفظية – الإشارات، تعابير الوجه، الإيموجي، الصور. شبه لفظية – نبرة الصوت، السرعة، العلو، وأونلاين: الحروف الكبيرة و\"!!!\". التواصل على الإنترنت بيستعمل التلاتة."],
["Netiquette (сетевой этикет): rules of polite behavior online. Virtual communication is mostly textual; the circle of addressees (senders and recipients) is known.","آداب الإنترنت: قواعد التصرف المهذب أونلاين. التواصل الافتراضي غالباً نصي، ودائرة المرسلين والمستقبلين بتكون معروفة."],
["Speech etiquette: ты (informal) vs Вы (polite). Respect = first name + patronymic: \"Ivan Anatolyevich\". Professional forms: \"Dear Alexandra Sergeevna!\", \"Respected Ivan Anatolyevich!\" (Уважаемый), \"Good afternoon, colleagues!\" — but NOT \"Dear friend!\".","آداب الكلام: ты للمقربين وВы للاحترام. الاحترام = الاسم + اسم الأب: \"إيفان أناتوليفيتش\". بالمراسلات الرسمية: \"عزيزتي ألكسندرا سيرغييفنا\"، \"المحترم إيفان أناتوليفيتش\"، \"مساء الخير يا زملاء\" – بس مش \"صديقي العزيز\"."],
["Conference etiquette: come on time, keep the time limit, thank the audience; listeners may ask clarifying questions afterwards. Being LATE violates etiquette.","آداب المؤتمرات: تيجي عالوقت، تلتزم بالوقت المحدد، تشكر الجمهور، والحضور بيقدروا يسألوا بعد العرض. التأخير مخالف للآداب."]
],
4:[
["Three literary kinds (роды литературы): EPIC (эпос) – narrative prose; LYRIC (лирика) – feelings; DRAMA (драма) – for the stage. Melodrama is NOT one of them.","الأجناس الأدبية التلاتة: الملحمي/السردي (эпос) – النثر القصصي. الغنائي (лирика) – المشاعر. الدرامي – للمسرح. الميلودراما مش وحدة منهم."],
["Epic genres: epic novel (роман-эпопея: War and Peace), novel (роман: Anna Karenina), novella/story (повесть), short story (рассказ), fairy tale, bylina. Lyric: poem, ode, elegy. Drama: tragedy, comedy, drama.","أنواع السرد: الرواية الملحمية (الحرب والسلم)، الرواية (آنا كارينينا)، القصة الطويلة (повесть)، القصة القصيرة (рассказ)، الحكاية الشعبية، البيلينا. الغنائي: قصيدة، أنشودة، رثائية. الدراما: مأساة، كوميديا، دراما."],
["Types of lyric poetry: LANDSCAPE (nature – Fet's \"The Steppe at Evening\"), LOVE (Pushkin's \"I loved you\"), PHILOSOPHICAL, CIVIC, RELIGIOUS.","أنواع الشعر الغنائي: شعر الطبيعة (\"السهوب في المساء\" لفيت)، شعر الحب (\"أحببتك\" لبوشكين)، الفلسفي، الوطني/المدني، الديني."],
["Tropes (тропы): METAPHOR – hidden comparison (\"glass of empty sky\"); SIMILE – comparison with like/as (как, словно, будто): \"like a flock of butterflies\"; EPITHET – artistic adjective (\"golden grove\"); PERSONIFICATION – nature acts like a person (\"the stars are sleeping\").","المجازات: الاستعارة – تشبيه مخفي (\"زجاج السماء الفارغة\"). التشبيه – مع \"مثل/كأن\" (как، словно، будто): \"مثل سرب فراشات\". النعت الفني (\"البستان الذهبي\"). التشخيص – الطبيعة بتتصرف متل إنسان (\"النجوم نايمة\")."],
["More tropes: HYPERBOLE – exaggeration; LITOTES – understatement; METONYMY – name transfer by closeness (\"I read Pushkin\" = his books); IRONY; ALLEGORY (fables: fox = cunning); OXYMORON – \"living corpse\".","مجازات تانية: المبالغة. التقليل. الكناية/المجاز المرسل (\"قرأت بوشكين\" = كتبه). السخرية. الرمز/الأليغوريا (الحكايات: الثعلب = المكر). الجمع بين الأضداد (\"جثة حية\")."],
["Figures of speech: ANAPHORA – repeating the beginning of lines; EPIPHORA – repeating the end; GRADATION – ascending or descending strengthening of homogeneous words (\"No regrets, no cries, no pain\"); ANTITHESIS – contrast; INVERSION – unusual word order; PARALLELISM; RHETORICAL QUESTION.","الصور البلاغية: التكرار بالبداية (anaphora). التكرار بالنهاية (epiphora). التدرج (gradation) – تقوية أو تخفيف تدريجي لكلمات متتالية، صاعد أو نازل. الطباق/المقابلة. التقديم والتأخير (inversion). التوازي. السؤال البلاغي."],
["Plot (сюжет): exposition → beginning of conflict (завязка) → rising action → CLIMAX (кульминация) → denouement (развязка). Also: theme, idea, hero, narrator, composition.","الحبكة: التمهيد ← بداية الصراع ← تصاعد الأحداث ← الذروة ← الحل. وكمان: الموضوع، الفكرة، البطل، الراوي، والبناء."],
["Russian verse meters: IAMB (ямб – Pushkin's favorite, da-DUM), TROCHEE (хорей, DUM-da), dactyl, amphibrach, anapest. Rhyme and stanza.","أوزان الشعر الروسي: الإيامب (المفضل عند بوشكين)، التروكي، الداكتيل، الأمفيبراخ، الأنابيست. وكمان القافية والمقطع."]
],
5:[
["19th century = GOLDEN AGE of Russian poetry: Pushkin, Lermontov, Tyutchev, Fet, Zhukovsky. Movements: sentimentalism (Karamzin, \"Poor Liza\") → romanticism → REALISM.","القرن 19 = العصر الذهبي للشعر الروسي: بوشكين، ليرمونتوف، تيوتشيف، فيت، جوكوفسكي. التيارات: العاطفية (كرامزين، \"ليزا المسكينة\") ← الرومانسية ← الواقعية."],
["Alexander PUSHKIN (1799–1837): founder of the modern Russian literary language. Studied at the Tsarskoye Selo Lyceum; \"Ruslan and Lyudmila\" (1820) made him famous; exiled to the south; died after a duel with d'Anthès. Works: \"Eugene Onegin\" (novel in verse, \"encyclopedia of Russian life\"), \"The Captain's Daughter\", \"Boris Godunov\", \"The Bronze Horseman\", \"I loved you\", \"Winter Morning\", fairy tales (\"The Tale of the Fisherman and the Fish\", \"Tsar Saltan\").","ألكسندر بوشكين (1799–1837): مؤسس اللغة الأدبية الروسية الحديثة. درس بليسيه تسارسكويه سيلو. \"روسلان ولودميلا\" (1820) شهّرته. انُفي للجنوب. مات بعد مبارزة مع دانتيس. أعماله: \"يفغيني أونيغين\" (رواية شعرية، \"موسوعة الحياة الروسية\")، \"ابنة الضابط\"، \"بوريس غودونوف\"، \"الفارس النحاسي\"، \"أحببتك\"، \"صباح شتوي\"، والحكايات (\"الصياد والسمكة\"، \"القيصر سلطان\")."],
["Mikhail LERMONTOV (1814–1841): \"A Hero of Our Time\" (Pechorin), \"The Death of the Poet\" (about Pushkin), \"The Sail\", \"Borodino\", \"Mtsyri\", \"The Demon\", \"The Prayer\". Also died in a duel.","ميخائيل ليرمونتوف (1814–1841): \"بطل من هذا الزمان\" (بيتشورين)، \"موت الشاعر\" (عن بوشكين)، \"الشراع\"، \"بورودينو\"، \"متسيري\"، \"الشيطان\"، \"الصلاة\". كمان مات بمبارزة."],
["Nikolai GOGOL (1809–1852): \"Dead Souls\" (Chichikov), \"The Government Inspector\" (comedy), \"The Overcoat\", \"The Nose\", \"Taras Bulba\", \"Evenings on a Farm near Dikanka\".","نيكولاي غوغول: \"الأرواح الميتة\" (تشيتشيكوف)، \"المفتش العام\" (كوميديا)، \"المعطف\"، \"الأنف\"، \"تاراس بولبا\"، \"أمسيات في قرية قرب ديكانكا\"."],
["Ivan TURGENEV: \"Fathers and Sons\" (Bazarov, nihilism), \"A Hunter's Sketches\", \"Mumu\", \"First Love\", \"Asya\".","إيفان تورغينيف: \"آباء وأبناء\" (بازاروف والعدمية)، \"مذكرات صياد\"، \"مومو\"، \"الحب الأول\"، \"آسيا\"."],
["Fyodor DOSTOEVSKY: \"Crime and Punishment\" (Raskolnikov), \"The Idiot\", \"The Brothers Karamazov\", \"Demons\", \"Poor Folk\", \"White Nights\".","فيودور دوستويفسكي: \"الجريمة والعقاب\" (راسكولنيكوف)، \"الأبله\"، \"الإخوة كارامازوف\"، \"الشياطين\"، \"المساكين\"، \"الليالي البيضاء\"."],
["Leo TOLSTOY (1828–1910): \"War and Peace\" (EPIC NOVEL, war of 1812), \"Anna Karenina\" (NOVEL), \"Resurrection\", \"Childhood\", \"Sevastopol Sketches\", \"The Death of Ivan Ilyich\". Estate: Yasnaya Polyana.","ليف تولستوي: \"الحرب والسلم\" (رواية ملحمية، حرب 1812)، \"آنا كارينينا\" (رواية)، \"البعث\"، \"الطفولة\"، \"حكايات سيفاستوبول\"، \"موت إيفان إيليتش\". مزرعته: ياسنايا بوليانا."],
["Anton CHEKHOV (1860–1904): doctor and master of the short story and drama. Stories: \"The Lady with the Dog\", \"Chameleon\", \"The Man in a Case\", \"Ward No. 6\". Plays: \"The Seagull\", \"Uncle Vanya\", \"Three Sisters\", \"The Cherry Orchard\". \"Brevity is the sister of talent.\"","أنطون تشيخوف: طبيب ومعلّم القصة القصيرة والمسرح. قصص: \"السيدة صاحبة الكلب\"، \"الحرباء\"، \"الرجل في العلبة\"، \"العنبر رقم 6\". مسرحيات: \"النورس\"، \"الخال فانيا\"، \"الشقيقات الثلاث\"، \"بستان الكرز\". \"الإيجاز أخو الموهبة\"."],
["Others of the 19th c.: Krylov (fables), Griboyedov (\"Woe from Wit\"), Ostrovsky (\"The Storm\"), Tyutchev (\"Russia cannot be understood with the mind\"), Fet (landscape lyrics), Nekrasov.","كتّاب تانيين من القرن 19: كريلوف (حكايات على لسان الحيوانات)، غريبويدوف (\"ذو العقل يشقى\")، أوستروفسكي (\"العاصفة\")، تيوتشيف (\"روسيا ما بتنفهم بالعقل\")، فيت (شعر الطبيعة)، نيكراسوف."],
["SILVER AGE (~1890s–1920s) movements: SYMBOLISM – Blok (\"The Twelve\"), Bryusov, Balmont; ACMEISM – Akhmatova, Gumilyov, Mandelstam; FUTURISM – Mayakovsky, Khlebnikov; IMAGINISM – Sergei Yesenin.","تيارات العصر الفضي (تقريباً 1890–1920): الرمزية – بلوك (\"الاثنا عشر\")، بريوسوف، بالمونت. الأكميزم – أخماتوفا، غوميليوف، ماندلشتام. المستقبلية – ماياكوفسكي، خليبنيكوف. الإيماجينيزم (الصورية) – سيرغي يسينين."],
["Sergei YESENIN (1895–1925): Imaginism, poet of the village, nature and Russia; \"The Birch Tree\", \"Letter to Mother\", \"No regrets, no cries, no pain…\", \"Persian Motifs\", \"Anna Snegina\".","سيرغي يسينين: الإيماجينيزم، شاعر القرية والطبيعة وروسيا. \"شجرة البتولا\"، \"رسالة إلى أمي\"، \"لا أندم ولا أنادي ولا أبكي\"، \"زخارف فارسية\"، \"آنا سنيغينا\"."],
["Vladimir MAYAKOVSKY (1893–1930): Futurism; themes – LOVE, REVOLUTION, the POET and his role in society; \"Lilichka!\", \"A Cloud in Trousers\", \"Listen!\", \"Left March\"; famous \"ladder\" line (лесенка).","فلاديمير ماياكوفسكي: المستقبلية. مواضيعه – الحب، الثورة، الشاعر ودوره بالمجتمع. \"ليليتشكا!\"، \"غيمة في بنطال\"، \"اسمعوا!\"، \"المسيرة اليسارية\". مشهور بالسطر على شكل درج."],
["Anna AKHMATOVA (Acmeism): \"Requiem\", \"Evening\", \"Rosary\". Marina TSVETAEVA: \"I like that you are not sick for me\", \"Homesickness\". Boris PASTERNAK: \"Doctor Zhivago\" (Nobel 1958).","آنا أخماتوفا (الأكميزم): \"قداس جنائزي\"، \"المساء\"، \"المسبحة\". مارينا تسفيتايفا: \"يعجبني أنك لست مريضاً بي\"، \"الحنين للوطن\". بوريس باسترناك: \"دكتور جيفاغو\" (نوبل 1958)."],
["20th c. prose: Ivan BUNIN – first Russian Nobel Prize in literature (1933), \"Dark Avenues\", \"The Gentleman from San Francisco\"; Alexander KUPRIN – \"The Garnet Bracelet\", \"The Duel\", \"Olesya\"; Maxim GORKY – \"The Lower Depths\", \"Mother\", \"Childhood\"; Mikhail SHOLOKHOV – \"And Quiet Flows the Don\" (Nobel 1965), \"The Fate of a Man\".","نثر القرن 20: إيفان بونين – أول روسي ياخد نوبل بالأدب (1933)، \"الدروب المظلمة\"، \"السيد من سان فرانسيسكو\". ألكسندر كوبرين – \"السوار العقيقي\"، \"المبارزة\"، \"أوليسيا\". مكسيم غوركي – \"الحضيض\"، \"الأم\"، \"الطفولة\". ميخائيل شولوخوف – \"الدون الهادئ\" (نوبل 1965)، \"مصير إنسان\"."],
["FOLKLORE (фольклор): fairy tales (сказки) – \"The Turnip\" (Репка), \"Kolobok\", \"Teremok\", Baba Yaga, Koschei the Deathless; BYLINY – epic songs about bogatyrs (Ilya Muromets, Dobrynya Nikitich, Alyosha Popovich); proverbs, sayings, riddles, chastushki, lullabies.","الفولكلور: الحكايات الشعبية – \"اللفتة\" (Репка)، \"كولوبوك\"، \"تيريموك\"، بابا ياغا، كوششي الخالد. البيلينات – أغاني ملحمية عن الأبطال (البوغاتير): إيليا موروميتس، دوبرينيا نيكيتيتش، أليوشا بوبوفيتش. والأمثال، الأقوال، الألغاز، التشاستوشكي، وأغاني النوم."]
],
6:[
["Culture: MATERIAL (tools, buildings, clothes, technology) and SPIRITUAL (customs, traditions, religion, values, language, art, science).","الثقافة: مادية (أدوات، مباني، ملابس، تكنولوجيا) وروحية/معنوية (عادات، تقاليد، دين، قيم، لغة، فن، علم)."],
["Symbols of Russia: BIRCH tree (берёза), bear, matryoshka, samovar, balalaika, troika, double-headed eagle (coat of arms), white-blue-red flag, Kremlin & Red Square, St. Basil's Cathedral, ushanka hat, valenki.","رموز روسيا: شجرة البتولا (берёза)، الدب، الماتريوشكا، السماور، البالالايكا، الترويكا، النسر ذو الرأسين (شعار الدولة)، العلم أبيض-أزرق-أحمر، الكرملين والساحة الحمراء، كاتدرائية القديس باسيل، قبعة الأوشانكا، الفالينكي."],
["Folk crafts: GZHEL – blue-and-white ceramics; KHOKHLOMA – red-black-gold painting on wood; PALEKH – lacquer miniatures; DYMKOVO toy – clay toys; Pavlovo Posad shawls. Opera and ballet are NOT folk culture (they are classical art).","الحرف الشعبية: غجيل – خزف أزرق وأبيض. خوخلوما – رسم أحمر وأسود وذهبي على الخشب. باليخ – منمنمات مطلية. ألعاب ديمكوفو الطينية. شالات بافلوفو بوساد. الأوبرا والباليه مش ثقافة شعبية (هي فن كلاسيكي)."],
["Holidays: NEW YEAR – fir tree (ёлка), Ded Moroz & Snegurochka; Orthodox CHRISTMAS – January 7; MASLENITSA – BLINI (pancakes), burning a straw effigy, farewell to winter; EASTER – KULICH, paskha, painted eggs; IVAN KUPALA – summer solstice, wreaths, jumping over fire.","الأعياد: رأس السنة – شجرة الصنوبر، ديد موروز وسنيغوروتشكا. الميلاد الأرثوذكسي – 7 يناير. ماسلينيتسا – البليني (فطائر)، حرق دمية القش، وداع الشتاء. عيد الفصح – الكوليتش، الباسخا، البيض الملون. إيفان كوبالا – أطول يوم بالسنة، أكاليل الورد، القفز فوق النار."],
["Other dates: Victory Day – May 9 (St. George ribbon); Day of Russia – June 12; Cosmonautics Day – April 12 (Gagarin, 1961); Women's Day – March 8; Defender of the Fatherland – February 23; Knowledge Day – September 1; Unity Day – November 4.","مناسبات تانية: يوم النصر – 9 مايو (شريط القديس جورج). يوم روسيا – 12 يونيو. يوم الفضاء – 12 أبريل (غاغارين 1961). يوم المرأة – 8 مارس. يوم حماة الوطن – 23 فبراير. يوم المعرفة – 1 سبتمبر. يوم الوحدة – 4 نوفمبر."],
["Painters: Viktor VASNETSOV – \"Bogatyrs\", \"Alyonushka\", \"Knight at the Crossroads\" (fairy tales & epics); Ilya REPIN – \"Barge Haulers on the Volga\"; Ivan AIVAZOVSKY – seascapes, \"The Ninth Wave\"; Ivan SHISHKIN – \"Morning in a Pine Forest\" (bears); Isaac LEVITAN – landscapes, \"Golden Autumn\"; Karl BRYULLOV – \"The Last Day of Pompeii\".","الرسامين: فيكتور فاسنيتسوف – \"الأبطال الثلاثة\"، \"أليونوشكا\"، \"الفارس عند مفترق الطرق\" (حكايات وملاحم). إيليا ريبين – \"جرّارو المراكب على الفولغا\". إيفان أيفازوفسكي – رسام البحر، \"الموجة التاسعة\". إيفان شيشكين – \"صباح في غابة الصنوبر\" (الدببة). إسحاق ليفيتان – مناظر طبيعية، \"الخريف الذهبي\". كارل بريولوف – \"اليوم الأخير لبومبي\"."],
["More art: Surikov – \"Boyarynya Morozova\"; Savrasov – \"The Rooks Have Come Back\"; Kramskoi – \"Unknown Woman\"; Andrei Rublev – icon \"Trinity\"; Malevich – \"Black Square\"; Kandinsky – abstraction. The Peredvizhniki (Wanderers) – realist painters. Museums: Tretyakov Gallery (Moscow), Hermitage & Russian Museum (St. Petersburg).","فن كمان: سوريكوف – \"النبيلة موروزوفا\". سافراسوف – \"عادت الغربان\". كرامسكوي – \"امرأة مجهولة\". أندريه روبليوف – أيقونة \"الثالوث\". ماليفيتش – \"المربع الأسود\". كاندينسكي – التجريد. جماعة \"المتجولين\" – رسامين واقعيين. المتاحف: غاليري تريتياكوف (موسكو)، الإرميتاج والمتحف الروسي (سانت بطرسبرغ)."],
["Composers: Mikhail GLINKA – founder of Russian classical music (\"Ivan Susanin\", \"Ruslan and Lyudmila\"); Pyotr TCHAIKOVSKY – ballets \"Swan Lake\", \"The Nutcracker\", \"Sleeping Beauty\", opera \"Eugene Onegin\"; The Mighty Handful – Mussorgsky (\"Boris Godunov\"), Rimsky-Korsakov (\"Scheherazade\", \"Flight of the Bumblebee\"), Borodin (\"Prince Igor\").","الملحنين: ميخائيل غلينكا – مؤسس الموسيقى الكلاسيكية الروسية (\"إيفان سوسانين\"، \"روسلان ولودميلا\"). بيوتر تشايكوفسكي – باليهات \"بحيرة البجع\"، \"كسارة البندق\"، \"الجميلة النائمة\"، وأوبرا \"يفغيني أونيغين\". \"الخمسة العظماء\": موسورغسكي (\"بوريس غودونوف\")، ريمسكي-كورساكوف (\"شهرزاد\"، \"طيران النحلة\")، بورودين (\"الأمير إيغور\")."],
["20th c. composers: Sergei PROKOFIEV – ballet \"Romeo and Juliet\", \"Peter and the Wolf\", \"Cinderella\"; Sergei RACHMANINOFF – Piano Concerto No. 2; Igor STRAVINSKY – \"The Firebird\", \"The Rite of Spring\"; Dmitri SHOSTAKOVICH – Symphony No. 7 \"Leningrad\".","ملحنين القرن 20: سيرغي بروكوفييف – باليه \"روميو وجولييت\"، \"بيتيا والذئب\"، \"سندريلا\". سيرغي رحمانينوف – كونشيرتو البيانو رقم 2. إيغور سترافينسكي – \"طائر النار\"، \"طقوس الربيع\". ديمتري شوستاكوفيتش – السيمفونية السابعة \"لينينغراد\"."],
["BALLET is a form of performing art, a musical-theatrical performance where artistic images are expressed through dance, pantomime and music. Famous theaters: Bolshoi (Moscow), Mariinsky (St. Petersburg). Dancers: Anna Pavlova, Galina Ulanova, Maya Plisetskaya, Rudolf Nureyev. Choreographer Marius Petipa; Diaghilev's \"Russian Seasons\".","الباليه: فن أدائي، عرض موسيقي مسرحي بتتجسد فيه الصور الفنية عن طريق الرقص والإيماء والموسيقى. أشهر المسارح: البولشوي (موسكو) والمارينسكي (سانت بطرسبرغ). راقصين: آنا بافلوفا، غالينا أولانوفا، مايا بليسيتسكايا، رودولف نورييف. مصمم الرقص ماريوس بيتيبا، و\"المواسم الروسية\" لدياغيليف."],
["Who is who (trap names): Ivan Aivazovsky – PAINTER; Maya Plisetskaya – BALLERINA; Lyudmila Gurchenko – ACTRESS; Fyodor Chaliapin – opera SINGER (bass); Yuri Gagarin – first man in space.","مين مين (أسماء بتلخبط): إيفان أيفازوفسكي – رسام. مايا بليسيتسكايا – راقصة باليه. لودميلا غورتشينكو – ممثلة. فيودور شاليابين – مغني أوبرا. يوري غاغارين – أول إنسان بالفضاء."]
]

let PQ=null;
function picQuiz(kind){
  const src=kind==="sym"?SYM:ART;
  PQ={kind,order:shuffle(src.map((_,i)=>i)),pos:0,score:0};pqRender();
}
function pqRender(){
  const src=PQ.kind==="sym"?SYM:ART;
  if(PQ.pos>=PQ.order.length){app.innerHTML=`<div class="card"><div class="score">${PQ.score} / ${src.length}</div><div class="row" style="justify-content:center"><button class="btn" onclick="picQuiz('${PQ.kind}')">مرة كمان</button><button class="btn sec" onclick="pics('${PQ.kind}')">رجوع</button></div></div>`;return}
  const i=PQ.order[PQ.pos],it=src[i];PQ.done=false;
  let opts,prompt;
  if(PQ.kind==="sym"){
    opts=shuffle([i].concat(shuffle(src.map((_,k)=>k).filter(k=>k!==i)).slice(0,3))).map(k=>({k,t:src[k][0],a:src[k][2]}));
    prompt=`<div style="height:170px">${it[5]}</div><div class="mut">شو هاد الرمز؟</div>`;
  }else{
    const artists=[...new Set(ART.map(a=>a[3]))];
    const others=shuffle(artists.filter(x=>x!==it[3])).slice(0,3);
    opts=shuffle([it[3]].concat(others)).map(t=>({k:t,t,a:""}));
    prompt=`<div class="en" style="font-size:16px">${W(it[5])}</div><div class="ar">${W(it[6])}</div><div class="mut" style="margin-top:6px">مين رسم هاللوحة؟</div>`;
  }
  PQ.ans=PQ.kind==="sym"?i:it[3];
  app.innerHTML=`<div class="mut">${PQ.pos+1} / ${src.length} · صح: ${PQ.score}</div><div class="card" style="text-align:center">${prompt}</div>
  ${opts.map(o=>`<div class="opt" data-k="${esc(o.k)}" onclick="pqPick(this)">${W(o.t)}${o.a?`<div class="ar">${esc(o.a)}</div>`:""}</div>`).join("")}<div id="pqfb"></div>
  <button class="btn sec" onclick="pics('${PQ.kind}')">← رجوع</button>`;
}
function pqPick(el){
  if(PQ.done)return;PQ.done=true;const k=el.dataset.k,ok=String(k)===String(PQ.ans);if(ok){PQ.score++;addXp(4)}
  document.querySelectorAll(".opt").forEach(o=>{if(o.dataset.k===String(PQ.ans))o.classList.add("good");else if(o===el)o.classList.add("badx")});
  const src=PQ.kind==="sym"?SYM:ART,it=src[PQ.order[PQ.pos]];
  document.getElementById("pqfb").innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?"✅":"❌"} <span class="en" style="display:inline">${esc(PQ.kind==="sym"?it[0]:it[0]+" — "+it[3])}</span> · <span class="ruw w">${esc(it[1])}</span></div><button class="btn" style="margin:10px 0" onclick="PQ.pos++;pqRender()">التالي ←</button>`;
  speak(it[1],"ru-RU");
}

let voices=[];
function loadV(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function langOf(t){if(/[А-Яа-яЁё]/.test(t))return"ru-RU";if(/[؀-ۿ]/.test(t))return"ar-SA";return"en-US"}
function speak(text,lang,rate){
  try{
    lang=lang||langOf(text);
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate||(lang==="ru-RU"?0.8:0.9);
    const pre=lang.slice(0,2);const v=voices.find(v=>v.lang&&v.lang.replace("_","-").startsWith(pre));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){toast("المتصفح ما بيدعم النطق")}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
/* wrap each word into a tappable span */
function W(text){
  return String(text).split(/([A-Za-zÀ-ÿА-Яа-яЁё\u0600-\u06FF0-9'’\-]+)/).map((m,j)=>{
    if(j%2===0)return esc(m).replace(/\n/g,"<br>");
    const ru=/[А-Яа-яЁё]/.test(m);return `<span class="w${ru?' ruw':''}">${esc(m)}</span>`}).join("");
}
function EN(en,ar){return `<div class="en">${W(en)} <button class="tbtn" style="padding:2px 7px" data-say="${esc(en).replace(/"/g,'&quot;')}">🔊</button></div>${ar?`<div class="ar">${W(ar)}</div>`:""}`}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-say]");if(b){e.stopPropagation();speak(b.getAttribute("data-say"));return}
  const t=e.target.closest(".arbtn");if(t){const box=t.closest(".card").querySelectorAll(".ar");box.forEach(x=>x.classList.toggle("show"));return}
  const w=e.target.closest(".w");if(w){w.classList.add("say");setTimeout(()=>w.classList.remove("say"),600);speak(w.textContent)}
},true);
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}

let QZ=null;
function quiz(){
  app.innerHTML=`<div class="card"><h2>🎯 اختار محور</h2>
  <div class="grid">${Object.keys(FIELDS).map(k=>{const qs=Q.filter(q=>q[0]==k);const r=qs.filter(q=>S.seen[Q.indexOf(q)]).length;return `<button class="tile" onclick="quizStart(${k})"><div class="ic">${FIELDS[k].i}</div><b>${FIELDS[k].a.split(" (")[0]}</b><small>${r}/${qs.length} صح</small></button>`}).join("")}
  <button class="tile" onclick="quizStart('all')"><div class="ic">🎲</div><b>خلطة عشوائية</b><small>20 سؤال من كل المحاور</small></button>
  <button class="tile" onclick="quizStart('wrong')"><div class="ic">🔁</div><b>أخطائي</b><small>${S.wrong.length} سؤال</small></button>
  </div></div>`;
}
function quizStart(f,examMode){
  let ids;
  if(f==="wrong"){ids=S.wrong.slice();if(!ids.length){toast("ما عندك أخطاء! 👏");return}}
  else if(f==="all")ids=shuffle(Q.map((_,i)=>i)).slice(0,20);
  else ids=shuffle(Q.map((q,i)=>q[0]==f?i:-1).filter(i=>i>=0));
  QZ={ids,pos:0,score:0,max:0,exam:!!examMode,sel:new Set(),done:false,res:[]};
  document.querySelectorAll("nav.bot button").forEach(b=>b.classList.toggle("on",b.dataset.v===(examMode?"exam":"quiz")));
  renderQ();
}
function renderQ(){
  const i=QZ.ids[QZ.pos],q=Q[i];QZ.sel=new Set();QZ.done=false;
  QZ.order=shuffle(q[4].map((_,k)=>k));
  const pct=Math.round(QZ.pos/QZ.ids.length*100);
  app.innerHTML=`<div class="row" style="justify-content:space-between"><span class="mut">سؤال ${QZ.pos+1} / ${QZ.ids.length}</span><span class="mut">${QZ.exam?"":"صح: "+QZ.score}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card">
   <div style="margin-bottom:6px"><span class="tag">${FIELDS[q[0]].i} ${FIELDS[q[0]].a.split(" (")[0]}</span>${q[1]?'<span class="tag m">كذا إجابة · 3 علامات</span>':'<span class="tag">إجابة وحدة · 1 علامة</span>'} <button class="tbtn arbtn" style="padding:2px 8px">🌐</button></div>
   ${EN(q[2],q[3])}
   <div id="opts">${QZ.order.map(k=>`<div class="opt" data-k="${k}" onclick="pick(${k})">${W(q[4][k][0])}<div class="ar">${W(q[4][k][1])}</div></div>`).join("")}</div>
   <div id="fb"></div>
   <div class="row" style="margin-top:10px"><button class="btn" id="chk" onclick="check()" disabled>تحقق ✔</button></div>
  </div>
  ${QZ.exam?'':'<button class="btn sec" onclick="quiz()">إنهاء</button>'}`;
}
function pick(k){
  if(QZ.done)return;const q=Q[QZ.ids[QZ.pos]];
  if(q[1]){QZ.sel.has(k)?QZ.sel.delete(k):QZ.sel.add(k)}else{QZ.sel=new Set([k])}
  document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",QZ.sel.has(+o.dataset.k)));
  document.getElementById("chk").disabled=!QZ.sel.size;
}
function check(){
  if(QZ.done){next();return}
  const i=QZ.ids[QZ.pos],q=Q[i],ans=new Set(q[5]);QZ.done=true;
  const ok=QZ.sel.size===ans.size&&[...QZ.sel].every(x=>ans.has(x));
  let pts=0;
  if(q[1]){const hit=[...QZ.sel].filter(x=>ans.has(x)).length,wrong=[...QZ.sel].filter(x=>!ans.has(x)).length;pts=Math.max(0,hit-wrong);QZ.max+=3}else{pts=ok?1:0;QZ.max+=1}
  QZ.score+=pts;QZ.res.push({i,ok,pts});
  S.seen[i]=ok;S.wrong=S.wrong.filter(x=>x!==i);if(!ok)S.wrong.push(i);if(ok)addXp(q[1]?15:10);else save();
  if(QZ.exam){next();return}
  document.querySelectorAll(".opt").forEach(o=>{const k=+o.dataset.k;if(ans.has(k))o.classList.add("good");else if(QZ.sel.has(k))o.classList.add("badx")});
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?"✅ ممتاز!":"❌ مش تمام."} ${q[1]&&!ok?`(أخدت ${pts}/3)`:""}<br>${W(q[6])}</div>`;
  const b=document.getElementById("chk");b.disabled=false;b.textContent=QZ.pos+1<QZ.ids.length?"التالي ←":"النتيجة 🏁";
  if(ok)speak(["Great!","Excellent!","Correct!","Отлично!","Молодец!"][Math.floor(Math.random()*5)]);
}
function next(){QZ.pos++;if(QZ.pos<QZ.ids.length)renderQ();else results()}
function results(){
  const p=Math.round(QZ.score/QZ.max*100);
  app.innerHTML=`<div class="card"><h2>${QZ.exam?"📝 نتيجة الامتحان التجريبي":"🏁 النتيجة"}</h2>
  <div class="score">${QZ.score} / ${QZ.max}</div><div class="bar"><i style="width:${p}%"></i></div>
  <div class="mut" style="text-align:center">${p>=90?"🔥 مستوى ممتاز، كمّل هيك!":p>=70?"👍 منيح، راجع الأخطاء":"📚 ارجع للملخصات وراجع أخطائك"}</div></div>
  <div class="card"><h3>المراجعة</h3>${QZ.res.map(r=>{const q=Q[r.i];return `<div class="fact"><div>${r.ok?"✅":"❌"} <span class="en">${W(q[2])}</span></div><div class="mut en">✔ ${q[5].map(k=>esc(q[4][k][0])).join(" · ")}</div><div class="ar">${W(q[3])}</div><div class="mut">${esc(q[6])}</div></div>`}).join("")}</div>
  <div class="row"><button class="btn" onclick="quizStart('wrong')">🔁 راجع أخطائي</button><button class="btn sec" onclick="go('home')">الرئيسية</button></div>`;
}

/* Ordering */
let OD=null;
function orderStart(i){
  const o=ORDER[i];OD={i,seq:[],perm:shuffle(o.frags.map((_,k)=>k))};renderOrder();
}
function renderOrder(){
  const o=ORDER[OD.i];
  app.innerHTML=`<div class="chips">${ORDER.map((x,k)=>`<button class="chip ${k==OD.i?'on':''}" onclick="orderStart(${k})">${x.ar}</button>`).join("")}</div>
  <div class="card"><h2>🧩 ${o.ar}</h2><div class="mut">من 7 مقاطع، اختار <b>5</b> بيعملوا نص مترابط ورتّبهم. في مقطعين موضوعهم مختلف لازم تتركهم. اضغط على المقاطع بالترتيب.</div>
  <div class="mut en" style="margin-top:6px">Your answer: <b>${OD.seq.map(k=>k+1).join("") || "…"}</b></div></div>
  ${OD.perm.map(k=>`<div class="frag ${OD.seq.includes(k)?'used':''}" onclick="oPick(${k})"><b class="n">${k+1}</b>${W(o.frags[k])}</div>`).join("")}
  <div id="ofb"></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="oCheck()" ${OD.seq.length===5?"":"disabled"}>تحقق ✔</button><button class="btn sec" onclick="orderStart(${OD.i})">إعادة</button></div>`;
}
function oPick(k){if(OD.seq.includes(k)){OD.seq=OD.seq.filter(x=>x!==k)}else if(OD.seq.length<5)OD.seq.push(k);renderOrder()}
function oCheck(){
  const o=ORDER[OD.i],ans=o.ans.map(x=>x-1),ok=OD.seq.every((x,j)=>x===ans[j]);
  const right=OD.seq.filter(x=>ans.includes(x)).length;
  if(ok)addXp(30);
  document.getElementById("ofb").innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?"✅ مية بالمية!":`❌ المقاطع الصح اللي اخترتها: ${right}/5`}<br><span class="en">Correct: <b>${o.ans.join("")}</b></span><br>الطريقة: احذف المقطعين اللي موضوعهم مختلف ← ابدأ بالتعريف/المقدمة ← التاريخ ← التفاصيل ← الأهمية اليوم بالآخر.</div>`;
}

  app.innerHTML=`<div class="mut">${AB.pos+1} / ${ABC.length} · صح: ${AB.score}</div>
  <div class="card" style="text-align:center">${AB.mode==="see"?`<div class="big" style="font-size:72px">${a[0]} ${a[1]}</div><div class="mut">شو صوت هالحرف؟</div>`:`<button class="btn" style="font-size:22px" onclick="speak(ABC[${i}][5],'ru-RU',0.6)">🔊 اسمع الكلمة</button><div class="mut" style="margin-top:6px">بأي حرف بتبلش الكلمة؟</div>`}</div>
  ${opts.map(k=>`<div class="opt" style="text-align:center;font-size:${AB.mode==="see"?18:28}px" data-k="${k}" onclick="abPick(${k})">${AB.mode==="see"?esc(ABC[k][4])+' <span class="mut en" style="display:inline">('+esc(ABC[k][3])+')</span>':ABC[k][0]+' '+ABC[k][1]}</div>`).join("")}
  <div id="abfb"></div><button class="btn sec" onclick="alphabet()">← رجوع</button>`;
  if(AB.mode==="hear")speak(a[5],"ru-RU",0.6);
}
function abPick(k){
  if(AB.done)return;AB.done=true;const ok=k===AB.cur,a=ABC[AB.cur];if(ok){AB.score++;addXp(3)}
  document.querySelectorAll(".opt").forEach(o=>{if(+o.dataset.k===AB.cur)o.classList.add("good");else if(+o.dataset.k===k)o.classList.add("badx")});
  document.getElementById("abfb").innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?"✅":"❌"} ${a[0]} = ${esc(a[4])} · <span class="ruw">${esc(a[5])}</span> = ${esc(a[6])}</div><button class="btn" style="margin:10px 0" onclick="AB.pos++;abQ()">التالي ←</button>`;
  speak(a[2],"ru-RU",0.6);
}

/* Writing / oral */
function writeMenu(){
  app.innerHTML=`<div class="card"><h2>✍️ المهام الكتابية والشفهية</h2><div class="mut">بالامتحان: 3 مهام كتابية (41–43، كل وحدة 10 علامات) + تختار مهمة شفهية وحدة (44–46، 5 علامات).</div></div>
  ${WRITE.map((w,i)=>`<button class="opt" style="text-align:right" onclick="writeTask(${i})">${w.type==="w"?"✍️":"🎤"} ${w.ar}</button>`).join("")}`;
}
function writeTask(i){
  const w=WRITE[i];
  let draft="";try{draft=localStorage.getItem("odw"+i)||""}catch(e){}
  app.innerHTML=`<div class="card"><h2>${w.type==="w"?"✍️":"🎤"} ${esc(w.ar)}</h2><div class="mut en">${esc(w.t)}</div>
  <div style="margin-top:8px"><button class="tbtn arbtn">🌐 ترجمة</button></div>
  ${EN(w.q,w.qa)}</div>
  ${w.min||w.type==="w"?`<div class="card"><h3>إجابتك</h3><textarea id="ta" placeholder="Write your answer in English (or Russian)…">${esc(draft)}</textarea>
  <div class="mut" id="wc"></div></div>`:`<div class="card"><h3>🎤 تدرّب بصوتك</h3><div class="mut">احكي الإجابة بصوت عالي (سجّل حالك بمسجل الصوت بالموبايل)، بعدين قارن مع النموذج. حاول تحكي 30–60 ثانية.</div></div>`}
  <div class="card chk"><h3>✅ قائمة التحقق (معايير التصحيح)</h3>${w.chk.map(c=>`<label><input type="checkbox"> <span class="en">${W(c)}</span></label>`).join("")}</div>
  <div class="card"><button class="btn" onclick="this.nextElementSibling.style.display='block';this.remove()">👀 أظهر الإجابة النموذجية</button>
  <div style="display:none"><h3>إجابة نموذجية</h3>${EN(w.model)}<div class="mut" style="margin-top:6px">اضغط 🔊 لتسمعها كاملة، أو اضغط على أي كلمة.</div></div></div>
  <button class="btn sec" onclick="writeMenu()">← رجوع</button>`;
  const ta=document.getElementById("ta");
  if(ta){const up=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length,p=ta.value.split(/\n\s*\n/).filter(x=>x.trim()).length;
    document.getElementById("wc").innerHTML=`عدد الكلمات: <b>${n}</b>${w.min?` / المطلوب ${w.min}+ ${n>=w.min?"✅":""}`:""} · فقرات: <b>${p}</b>`;try{localStorage.setItem("odw"+i,ta.value)}catch(e){}};
    ta.addEventListener("input",up);up();}
}

save();go("home");
</script>
